        </div>
      ) : (
        <p className="text-xs" style={{ color: "#9CA3AF" }}>오늘 등록된 일정이 없습니다.</p>
      )}
    </div>
  );
}

function PipContent({ schedules, companyEvents, holidayName, members, onEditSchedule, onEditCompanyEvent }) {
  return (
    <div style={{ fontFamily: FONT_SANS, backgroundColor: "#F5F6F8", minHeight: "100vh", padding: 10 }}>
      <MobileDayAgenda
        schedules={schedules}
        companyEvents={companyEvents}
        holidayName={holidayName}
        members={members}
        onEditSchedule={onEditSchedule}
        onEditCompanyEvent={onEditCompanyEvent}
      />
    </div>
  );
}

function App() {
  const [authLoaded, setAuthLoaded] = useState(false);
  const [user, setUser] = useState(null);
  const [changePasswordOpen, setChangePasswordOpen] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [members, setMembers] = useState([]);
  const [schedules, setSchedules] = useState([]);
  const [companyEvents, setCompanyEvents] = useState([]);
  const [holidays, setHolidays] = useState([]);
  const [recurringEvents, setRecurringEvents] = useState([]);
  const [currentDate, setCurrentDate] = useState(new Date());
  const [view, setView] = useState("month");
  const [filterMembers, setFilterMembers] = useState(new Set());
  const [filterTypes, setFilterTypes] = useState(new Set());
  const [modalOpen, setModalOpen] = useState(false);
  const [editingItem, setEditingItem] = useState(null);
  const [editingKind, setEditingKind] = useState(null); // "schedule" | "company"
  const [modalDefaultDate, setModalDefaultDate] = useState(null);
  const [modalDefaultMemberId, setModalDefaultMemberId] = useState(null);
  const [dayDetailKey, setDayDetailKey] = useState(null);
  const [recurringInfoTarget, setRecurringInfoTarget] = useState(null);
  const [mobileShowFullMonth, setMobileShowFullMonth] = useState(false);
  const [pipRoot, setPipRoot] = useState(null);
  const [saveError, setSaveError] = useState(false);
  const [needsSeedConfirm, setNeedsSeedConfirm] = useState(false);
  const [excelPreview, setExcelPreview] = useState(null);
  const [excelBusy, setExcelBusy] = useState(false);
  const fileInputRef = useRef(null);

  // track login state (persists across page reloads automatically)
  useEffect(() => {
    const unsubscribe = auth.onAuthStateChanged((u) => {
      setUser(u);
      setAuthLoaded(true);
    });
    return unsubscribe;
  }, []);

  // subscribe to Firebase Realtime Database — keeps all team members in sync live
  useEffect(() => {
    if (!user) return;
    const dataRef = db.ref(STORAGE_KEY);
    const handleValue = (snapshot) => {
      const data = snapshot.val();
      if (data) {
        setMembers(data.members || []);
        setSchedules(data.schedules || []);
        setCompanyEvents(data.companyEvents || []);
        setHolidays(data.holidays || []);
        setRecurringEvents(data.recurringEvents || []);
        setNeedsSeedConfirm(false);
      } else {
        // Nothing found at this path. This could mean it's genuinely a fresh
        // database, OR it could mean the read silently failed in a way that
        // returned no data. Never auto-write here — that would risk erasing
        // real data. Instead, surface a button so a human confirms it.
        setNeedsSeedConfirm(true);
      }
      setLoaded(true);
      setSaveError(false);
    };
    const handleError = () => {
      setSaveError(true);
      setLoaded(true);
    };
    dataRef.on("value", handleValue, handleError);
    return () => dataRef.off("value", handleValue);
  }, [user]);

  // 무급은 화면에서 항상 제외한다 (요구사항 4). 과거 데이터에 남아있어도 표시되지 않는다.
  const filteredSchedules = useMemo(() => {
    return schedules.filter(
      (s) =>
        s.type !== "무급" &&
        (filterMembers.size === 0 || filterMembers.has(s.memberId)) &&
        (filterTypes.size === 0 || filterTypes.has(s.type))
    );
  }, [schedules, filterMembers, filterTypes]);

  const scheduleMap = useMemo(() => {
    const map = {};
    filteredSchedules.forEach((s) => {
      const startKey = s.startDate || s.date;
      const endKey = s.endDate || s.startDate || s.date;
      let cursor = parseKey(startKey);
      const end = parseKey(endKey);
      let guard = 0;
      while (cursor <= end && guard < 60) {
        const k = toKey(cursor);
        if (!map[k]) map[k] = [];
        map[k].push(s);
        cursor = addDays(cursor, 1);
        guard++;
      }
    });
    return map;
  }, [filteredSchedules]);

  const companyEventMap = useMemo(() => {
    const map = {};
    companyEvents.forEach((ev) => {
      let cursor = parseKey(ev.startDate);
      const end = parseKey(ev.endDate || ev.startDate);
      let guard = 0;
      while (cursor <= end && guard < 60) {
        const k = toKey(cursor);
        if (!map[k]) map[k] = [];
        map[k].push(ev);
        cursor = addDays(cursor, 1);
        guard++;
      }
    });
    return map;
  }, [companyEvents]);

  const holidayMap = useMemo(() => {
    const map = {};
    holidays.forEach((h) => {
      const startKey = h.startDate || h.date;
      const endKey = h.endDate || h.startDate || h.date;
      let cursor = parseKey(startKey);
      const end = parseKey(endKey);
      let guard = 0;
      while (cursor <= end && guard < 60) {
        map[toKey(cursor)] = h.name;
        cursor = addDays(cursor, 1);
        guard++;
      }
    });
    return map;
  }, [holidays]);

  const recurringEventMap = useMemo(() => {
    const map = {};
    const today = new Date();
    const startYear = today.getFullYear() - 1;
    const endYear = today.getFullYear() + 2;
    recurringEvents.forEach((tpl) => {
      const activeMonths = tpl.months && tpl.months.length ? tpl.months : null; // null = 매월(모든 달)
      for (let y = startYear; y <= endYear; y++) {
        for (let mo = 1; mo <= 12; mo++) {
          if (activeMonths && !activeMonths.includes(mo)) continue;
          const ym = `${y}-${pad(mo)}`;
          const override = (tpl.overrides || {})[ym];
          if (override && override.skip) continue;
          const dateKey = override && override.date ? override.date : resolveRecurringDate(y, mo, tpl.dayOfMonth, tpl.shiftDirection, holidayMap);
          if (tpl.createdAt && dateKey < tpl.createdAt) continue;
          const title = override && override.title ? override.title : tpl.title;
          const note = override && override.note !== undefined ? override.note : tpl.note || "";
          if (!map[dateKey]) map[dateKey] = [];
          map[dateKey].push({
            id: `${tpl.id}_${ym}`,
            title,
            note,
            date: dateKey,
            yearMonth: ym,
            isRecurring: true,
            isOverridden: !!override,
            recurringId: tpl.id,
            kind: tpl.kind || "internal",
          });
        }
      }
    });
    return map;
  }, [recurringEvents, holidayMap]);

  const displayCompanyEventMap = useMemo(() => {
    const map = {};
    Object.keys(companyEventMap).forEach((k) => {
      map[k] = [...companyEventMap[k]];
    });
    Object.keys(recurringEventMap).forEach((k) => {
      map[k] = [...(map[k] || []), ...recurringEventMap[k]];
    });
    return map;
  }, [companyEventMap, recurringEventMap]);

  // 월간/주간 캘린더에서 여러 날짜에 걸친 일정을 하나의 막대로 표시하기 위한 원본 항목 목록
  const barItems = useMemo(() => {
    const items = [];
    filteredSchedules.forEach((s) => {
      const start = s.startDate || s.date;
      const end = s.endDate || s.startDate || s.date;
      items.push({ id: `s_${s.id}`, kind: "schedule", raw: s, startDate: start, endDate: end, sortKey: `${start}_s_${s.id}` });
    });
    companyEvents.forEach((ev) => {
      const start = ev.startDate;
      const end = ev.endDate || ev.startDate;
      items.push({ id: `c_${ev.id}`, kind: "company", raw: ev, startDate: start, endDate: end, sortKey: `${start}_c_${ev.id}` });
    });
    Object.values(recurringEventMap).forEach((list) => {
      list.forEach((r) => {
        items.push({ id: `r_${r.id}`, kind: "company", raw: r, startDate: r.date, endDate: r.date, sortKey: `${r.date}_r_${r.id}` });
      });
    });
    return items;
  }, [filteredSchedules, companyEvents, recurringEventMap]);

  const goPrev = () => setCurrentDate((d) => (view === "month" ? new Date(d.getFullYear(), d.getMonth() - 1, 1) : addDays(d, -7)));
  const goNext = () => setCurrentDate((d) => (view === "month" ? new Date(d.getFullYear(), d.getMonth() + 1, 1) : addDays(d, 7)));
  const goToday = () => setCurrentDate(new Date());

  const toggleMember = (id) =>
    setFilterMembers((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  const toggleType = (t) =>
    setFilterTypes((prev) => {
      const next = new Set(prev);
      if (next.has(t)) next.delete(t);
      else next.add(t);
      return next;
    });
  const resetFilters = () => {
    setFilterMembers(new Set());
    setFilterTypes(new Set());
  };

  const openAddModal = (dateKey) => {
    setEditingItem(null);
    setEditingKind(null);
    setModalDefaultDate(dateKey);
    setModalDefaultMemberId(filterMembers.size === 1 ? [...filterMembers][0] : null);
    setModalOpen(true);
  };
  const openEditSchedule = (schedule) => {
    setEditingItem(schedule);
    setEditingKind("schedule");
    setModalOpen(true);
    setDayDetailKey(null);
  };
  const openEditCompanyEvent = (event) => {
    if (event.isRecurring) {
      setRecurringInfoTarget(event);
      setDayDetailKey(null);
      return;
    }
    setEditingItem(event);
    setEditingKind("company");
    setModalOpen(true);
    setDayDetailKey(null);
  };
  const closeModal = () => {
    setModalOpen(false);
    setEditingItem(null);
    setEditingKind(null);
  };
  const pushToFirebase = (overrides) => {
    const payload = {
      members: overrides.members ?? members,
      schedules: overrides.schedules ?? schedules,
      companyEvents: overrides.companyEvents ?? companyEvents,
      holidays: overrides.holidays ?? holidays,
      recurringEvents: overrides.recurringEvents ?? recurringEvents,
    };
    db.ref(STORAGE_KEY)
      .set(payload)
      .then(() => setSaveError(false))
      .catch(() => setSaveError(true));
  };

  const saveSchedule = (data) => {
    const exists = schedules.some((s) => s.id === data.id);
    const newSchedules = exists ? schedules.map((s) => (s.id === data.id ? data : s)) : [...schedules, data];
    setSchedules(newSchedules);
    pushToFirebase({ schedules: newSchedules });
    closeModal();
  };
  const deleteSchedule = (id) => {
    const newSchedules = schedules.filter((s) => s.id !== id);
    setSchedules(newSchedules);
    pushToFirebase({ schedules: newSchedules });
    closeModal();
  };
  const saveCompanyEvent = (data) => {
    const exists = companyEvents.some((ev) => ev.id === data.id);
    const newEvents = exists ? companyEvents.map((ev) => (ev.id === data.id ? data : ev)) : [...companyEvents, data];
    setCompanyEvents(newEvents);
    pushToFirebase({ companyEvents: newEvents });
    closeModal();
  };
  const deleteCompanyEvent = (id) => {
    const newEvents = companyEvents.filter((ev) => ev.id !== id);
    setCompanyEvents(newEvents);
    pushToFirebase({ companyEvents: newEvents });
    closeModal();
  };
  const addHoliday = (data) => {
    const newHoliday = { id: genId("hol"), ...data };
    const newHolidays = [...holidays, newHoliday];
    setHolidays(newHolidays);
    pushToFirebase({ holidays: newHolidays });
  };
  const deleteHoliday = (id) => {
    const newHolidays = holidays.filter((h) => h.id !== id);
    setHolidays(newHolidays);
    pushToFirebase({ holidays: newHolidays });
  };
  const addRecurringEvent = (data) => {
    const newRecurring = { id: genId("rec"), createdAt: toKey(new Date()), ...data };
    const next = [...recurringEvents, newRecurring];
    setRecurringEvents(next);
    pushToFirebase({ recurringEvents: next });
  };
  const updateRecurringEvent = (id, data) => {
    const next = recurringEvents.map((r) => (r.id === id ? { ...r, ...data } : r));
    setRecurringEvents(next);
    pushToFirebase({ recurringEvents: next });
  };
  const deleteRecurringEvent = (id) => {
    if (!window.confirm("이 반복 일정을 삭제하면 앞으로 생성되는 모든 달의 항목이 사라집니다. 계속할까요?")) return;
    const next = recurringEvents.filter((r) => r.id !== id);
    setRecurringEvents(next);
    pushToFirebase({ recurringEvents: next });
  };
  const setRecurringOverride = (recurringId, yearMonth, overrideData) => {
    const next = recurringEvents.map((r) => {
      if (r.id !== recurringId) return r;
      const overrides = { ...(r.overrides || {}) };
      if (overrideData === null) {
        delete overrides[yearMonth];
      } else {
        overrides[yearMonth] = overrideData;
      }
      return { ...r, overrides };
    });
    setRecurringEvents(next);
    pushToFirebase({ recurringEvents: next });
  };
  const addMember = (data) => {
    const newMember = { id: genId("mem"), ...data };
    const newMembers = [...members, newMember];
    setMembers(newMembers);
    pushToFirebase({ members: newMembers });
    return newMember;
  };
  const updateMember = (id, data) => {
    const newMembers = members.map((m) => (m.id === id ? { ...m, ...data } : m));
    setMembers(newMembers);
    pushToFirebase({ members: newMembers });
  };
  const deleteMember = (id) => {
    if (!window.confirm("팀원을 삭제하면 해당 팀원의 모든 일정도 함께 삭제됩니다. 계속할까요?")) return;
    const newMembers = members.filter((m) => m.id !== id);
    const newSchedules = schedules.filter((s) => s.memberId !== id);
    setMembers(newMembers);
    setSchedules(newSchedules);
    pushToFirebase({ members: newMembers, schedules: newSchedules });
    setFilterMembers((prev) => {
      const next = new Set(prev);
      next.delete(id);
      return next;
    });
  };

  const exportCSV = () => {
    const header = ["날짜", "요일", "이름", "종류", "메모"];
    const scheduleRows = [];
    schedules.forEach((s) => {
      const m = members.find((mm) => mm.id === s.memberId);
      const startKey = s.startDate || s.date;
      const endKey = s.endDate || s.startDate || s.date;
      let cursor = parseKey(startKey);
      const end = parseKey(endKey);
      let guard = 0;
      while (cursor <= end && guard < 60) {
        scheduleRows.push([toKey(cursor), WEEKDAYS[cursor.getDay()], m ? m.name : "(삭제됨)", s.type, (s.note || "").replace(/\r?\n/g, " ")]);
        cursor = addDays(cursor, 1);
        guard++;
      }
    });
    const companyRows = [];
    companyEvents.forEach((ev) => {
      let cursor = parseKey(ev.startDate);
      const end = parseKey(ev.endDate || ev.startDate);
      let guard = 0;
      const kindLabel = ev.kind === "external" ? "[외부]" : "[내부]";
      const attendeeNames =
        ev.kind === "external" && ev.attendeeIds && ev.attendeeIds.length
          ? " (동반: " + ev.attendeeIds.map((id) => (members.find((mm) => mm.id === id) || {}).name || "?").join(", ") + ")"
          : "";
      while (cursor <= end && guard < 60) {
        const k = toKey(cursor);
        companyRows.push([k, WEEKDAYS[cursor.getDay()], "(전사)", `${kindLabel} ${ev.title}`, (ev.note || "").replace(/\r?\n/g, " ") + attendeeNames]);
        cursor = addDays(cursor, 1);
        guard++;
      }
    });
    Object.keys(recurringEventMap).forEach((k) => {
      const d = parseKey(k);
      recurringEventMap[k].forEach((ev) => {
        companyRows.push([k, WEEKDAYS[d.getDay()], "(전사·반복)", `${ev.kind === "external" ? "[외부]" : "[내부]"} ${ev.title}`, (ev.note || "").replace(/\r?\n/g, " ")]);
      });
    });
    const rows = [...scheduleRows, ...companyRows].sort((a, b) => a[0].localeCompare(b[0]));
    const csv = "\uFEFF" + [header, ...rows].map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `team-schedule-${toKey(currentDate)}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const logout = () => auth.signOut();

  const initializeDatabase = () => {
    if (!window.confirm("이 데이터베이스에 처음 사용할 샘플 데이터를 생성합니다. 계속할까요?")) return;
    const seed = seedData();
    db.ref(STORAGE_KEY)
      .set(seed)
      .then(() => setNeedsSeedConfirm(false))
      .catch(() => setSaveError(true));
  };

  const handleExcelFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setExcelBusy(true);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const results = parseExcelWorkbook(wb, members);
      if (results.length === 0) {
        alert('시트 이름에 "계획"이 포함된 시트를 찾지 못했거나, 그 안에서 "경영지원실" 데이터를 찾지 못했습니다. 파일 구조를 확인해 주세요.');
      } else {
        setExcelPreview(results);
      }
    } catch (err) {
      alert("엑셀 파일을 읽는 중 문제가 발생했습니다. 파일 형식을 확인해 주세요.");
    } finally {
      setExcelBusy(false);
    }
  };

  const applyExcelImport = () => {
    if (!excelPreview) return;
    setExcelBusy(true);
    let nextMembers = [...members];
    excelPreview.forEach((sheet) => {
      sheet.newNames.forEach((name) => {
        if (!nextMembers.some((mm) => mm.name === name)) {
          nextMembers.push({ id: genId("mem"), name, annualTotal: 15 });
        }
      });
    });
    const nameToId = {};
    nextMembers.forEach((mm) => {
      nameToId[mm.name] = mm.id;
    });

    const batchKeys = excelPreview.map((s) => s.batchKey);
    let nextSchedules = schedules.filter((s) => !batchKeys.includes(s.importBatch));

    excelPreview.forEach((sheet) => {
      sheet.people.forEach((person) => {
        const memberId = nameToId[person.name];
        if (!memberId) return;
        person.ranges.forEach((r) => {
          nextSchedules.push({
            id: genId("sch"),
            memberId,
            startDate: r.startDate,
            endDate: r.endDate,
            type: r.type,
            note: "",
            isHolidayWork: r.isHolidayWork,
            importBatch: sheet.batchKey,
          });
        });
      });
    });

    setMembers(nextMembers);
    setSchedules(nextSchedules);
    pushToFirebase({ members: nextMembers, schedules: nextSchedules });
    setExcelBusy(false);
    setExcelPreview(null);
  };

  const openPip = async () => {
    if (!("documentPictureInPicture" in window)) {
      alert("이 기능은 최신 Chrome, Edge, Firefox 브라우저의 PC 화면에서만 사용할 수 있어요.");
      return;
    }
    if (pipRoot) return;
    try {
      const pipWindow = await window.documentPictureInPicture.requestWindow({ width: 300, height: 420 });
      [...document.styleSheets].forEach((styleSheet) => {
        try {
          const cssRules = [...styleSheet.cssRules].map((rule) => rule.cssText).join("");
          const style = document.createElement("style");
          style.textContent = cssRules;
          pipWindow.document.head.appendChild(style);
        } catch (e) {
          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.type = styleSheet.type;
          link.media = styleSheet.media;
          link.href = styleSheet.href;
          pipWindow.document.head.appendChild(link);
        }
      });
      pipWindow.document.body.style.margin = "0";
      const container = pipWindow.document.createElement("div");
      pipWindow.document.body.appendChild(container);
      const root = ReactDOM.createRoot(container);
      pipWindow.addEventListener("pagehide", () => {
        setPipRoot(null);
      });
      setPipRoot(root);
    } catch (e) {
      alert("미니창을 여는 데 실패했습니다.");
    }
  };

  // keep the mini floating window's content live-synced with today's data
  useEffect(() => {
    if (!pipRoot) return;
    const todayKey = toKey(new Date());
    pipRoot.render(
      <PipContent
        schedules={scheduleMap[todayKey] || []}
        companyEvents={displayCompanyEventMap[todayKey] || []}
        holidayName={holidayMap[todayKey]}
        members={members}
        onEditSchedule={openEditSchedule}
        onEditCompanyEvent={openEditCompanyEvent}
      />
    );
  }, [pipRoot, scheduleMap, displayCompanyEventMap, holidayMap, members]);

  const titleText =
    view === "month"
      ? `${currentDate.getFullYear()}년 ${currentDate.getMonth() + 1}월`
      : (() => {
          const days = getWeekGrid(currentDate);
          const s = days[0],
            e = days[6];
          return `${s.getFullYear()}년 ${s.getMonth() + 1}월 ${s.getDate()}일 - ${e.getMonth() + 1}월 ${e.getDate()}일`;
        })();

  if (!authLoaded) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: "#F5F6F8", fontFamily: FONT_SANS }}>
        <p className="text-sm" style={{ color: "#9CA3AF" }}>불러오는 중...</p>
      </div>
    );
  }

  if (!user) {
    return <LoginScreen />;
  }

  if (!loaded) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: "#F5F6F8", fontFamily: FONT_SANS }}>
        <p className="text-sm" style={{ color: "#9CA3AF" }}>불러오는 중...</p>
      </div>
    );
  }

  return (
    <div className="min-h-screen w-full p-2 sm:p-4 md:p-6" style={{ backgroundColor: "#F5F6F8", fontFamily: FONT_SANS }}>
      <div className="max-w-7xl mx-auto space-y-4">
        <div className="bg-white border rounded-lg p-3 sm:p-4" style={{ borderColor: "#EEF0F3" }}>
          <div className="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between mb-3">
            <div className="flex flex-wrap items-center gap-2 sm:gap-3">
              <h1 className="text-base sm:text-lg font-bold" style={{ color: "#111827" }}>팀 스케줄 캘린더</h1>
              <div className="flex items-center gap-1">
                <button onClick={goPrev} className="p-2 rounded hover:bg-gray-100"><ChevronLeft size={16} /></button>
                <span className="text-xs sm:text-sm font-semibold px-1" style={{ fontFamily: FONT_MONO, color: "#374151", minWidth: 150, display: "inline-block", textAlign: "center", whiteSpace: "nowrap" }}>
                  {titleText}
                </span>
                <button onClick={goNext} className="p-2 rounded hover:bg-gray-100"><ChevronRight size={16} /></button>
              </div>
              <button onClick={goToday} className="text-xs font-semibold px-2 py-1.5 rounded border" style={{ borderColor: "#E5E7EB", color: "#6B7280" }}>오늘</button>
            </div>

            {/* desktop actions */}
            <div className="hidden sm:flex flex-wrap items-center gap-2">
              <div className="flex items-center rounded-lg border overflow-hidden" style={{ borderColor: "#E5E7EB" }}>
                <button onClick={() => setView("month")} className="text-xs font-semibold px-3 py-2" style={view === "month" ? { backgroundColor: ACCENT, color: "#fff" } : { backgroundColor: "#fff", color: "#6B7280" }}>월간</button>
                <button onClick={() => setView("week")} className="text-xs font-semibold px-3 py-2" style={view === "week" ? { backgroundColor: ACCENT, color: "#fff" } : { backgroundColor: "#fff", color: "#6B7280" }}>주간</button>
              </div>
              <button onClick={exportCSV} className="text-xs font-semibold px-3 py-2 rounded border flex items-center gap-1" style={{ borderColor: "#E5E7EB", color: "#374151" }}>
                <Download size={14} /> CSV 내보내기
              </button>
              <input type="file" accept=".xlsx,.xls" ref={fileInputRef} onChange={handleExcelFile} className="hidden" />
              <button
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                disabled={excelBusy}
                className="text-xs font-semibold px-3 py-2 rounded border flex items-center gap-1 disabled:opacity-50"
                style={{ borderColor: "#E5E7EB", color: "#374151" }}
              >
                <Upload size={14} /> {excelBusy ? "분석 중..." : "엑셀 업로드"}
              </button>
              <button
                onClick={openPip}
                disabled={!!pipRoot}
                className="text-xs font-semibold px-3 py-2 rounded border flex items-center gap-1 disabled:opacity-50"
                style={{ borderColor: "#E5E7EB", color: pipRoot ? ACCENT : "#374151" }}
              >
                <PipIcon size={14} /> {pipRoot ? "미니창 열림" : "미니창으로 보기"}
              </button>
              <button onClick={() => openAddModal(toKey(new Date()))} className="text-xs font-semibold px-3 py-2 rounded text-white flex items-center gap-1" style={{ backgroundColor: ACCENT }}>
                <Plus size={14} /> 일정 추가
              </button>
              <div className="w-px h-5" style={{ backgroundColor: "#E5E7EB" }} />
              <button onClick={() => setChangePasswordOpen(true)} className="text-xs font-semibold px-2 py-2" style={{ color: "#6B7280" }}>비밀번호 변경</button>
              <button onClick={logout} className="text-xs font-semibold px-2 py-2" style={{ color: "#DC2626" }}>로그아웃</button>
            </div>

            {/* mobile actions: one line, no view toggle / CSV */}
            <div className="flex sm:hidden items-center gap-1.5">
              <button onClick={() => openAddModal(toKey(new Date()))} className="text-xs font-semibold px-2.5 py-2 rounded text-white flex items-center gap-1" style={{ backgroundColor: ACCENT }}>
                <Plus size={13} /> 일정 추가
              </button>
              <button onClick={() => setChangePasswordOpen(true)} className="text-xs font-semibold px-2 py-2 whitespace-nowrap" style={{ color: "#6B7280" }}>비밀번호 변경</button>
              <button onClick={logout} className="text-xs font-semibold px-2 py-2 whitespace-nowrap" style={{ color: "#DC2626" }}>로그아웃</button>
            </div>
          </div>
          <div className="hidden sm:block">
            <Legend />
          </div>
        </div>

        {saveError && (
          <div className="text-xs px-3 py-2 rounded" style={{ backgroundColor: "#FEE2E2", color: "#DC2626" }}>
            데이터베이스 동기화에 실패했습니다. 인터넷 연결과 Firebase 설정을 확인해 주세요.
          </div>
        )}

        {needsSeedConfirm && !saveError && (
          <div className="text-xs px-3 py-2 rounded flex items-center justify-between gap-3 flex-wrap" style={{ backgroundColor: "#FEF3C7", color: "#92400E" }}>
            <span>이 데이터베이스 경로(<code style={{ fontFamily: FONT_MONO }}>{STORAGE_KEY}</code>)에서 데이터를 찾지 못했습니다. 기존 데이터가 있어야 한다면 Firebase 콘솔에서 규칙(Rules)과 데이터 경로를 먼저 확인해 주세요. 정말 처음 시작하는 경우에만 아래 버튼을 눌러주세요.</span>
            <button onClick={initializeDatabase} className="text-xs font-semibold px-3 py-1.5 rounded text-white whitespace-nowrap" style={{ backgroundColor: "#D97706" }}>
              초기 데이터 생성
            </button>
          </div>
        )}

        <FilterBar members={members} filterMembers={filterMembers} filterTypes={filterTypes} toggleMember={toggleMember} toggleType={toggleType} resetFilters={resetFilters} />

        {members.length === 0 && (
          <div className="text-xs px-4 py-3 rounded-lg border" style={{ backgroundColor: "#F0FDFA", borderColor: ACCENT_LIGHT, color: "#0F766E" }}>
            아직 등록된 팀원이 없습니다. 오른쪽 팀원 관리에서 팀원을 먼저 추가해 주세요.
          </div>
        )}

        <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">
          <div className="lg:col-span-3 space-y-3">
            {/* desktop: month/week grid as before */}
            <div className="hidden sm:block">
              {view === "month" ? (
                <MonthView
                  currentDate={currentDate}
                  barItems={barItems}
                  holidayMap={holidayMap}
                  members={members}
                  onAdd={openAddModal}
                  onEditSchedule={openEditSchedule}
                  onEditCompanyEvent={openEditCompanyEvent}
                  onShowMore={setDayDetailKey}
                />
              ) : (
                <WeekView
                  currentDate={currentDate}
                  barItems={barItems}
                  holidayMap={holidayMap}
                  members={members}
                  onAdd={openAddModal}
                  onEditSchedule={openEditSchedule}
                  onEditCompanyEvent={openEditCompanyEvent}
                  onShowMore={setDayDetailKey}
                />
              )}
            </div>

            {/* mobile: today's agenda by default, full month grid on demand */}
            <div className="sm:hidden space-y-3">
              {mobileShowFullMonth ? (
                <>
                  <MonthView
                    currentDate={currentDate}
                    barItems={barItems}
                    holidayMap={holidayMap}
                    members={members}
                    onAdd={openAddModal}
                    onEditSchedule={openEditSchedule}
                    onEditCompanyEvent={openEditCompanyEvent}
                    onShowMore={setDayDetailKey}
                  />
                  <button
                    onClick={() => setMobileShowFullMonth(false)}
                    className="w-full text-xs font-semibold py-2.5 rounded border"
                    style={{ borderColor: "#E5E7EB", color: "#374151" }}
                  >
                    오늘 일정만 보기
                  </button>
                </>
              ) : (
                <>
                  <MobileDayAgenda
                    schedules={scheduleMap[toKey(new Date())] || []}
                    companyEvents={displayCompanyEventMap[toKey(new Date())] || []}
                    holidayName={holidayMap[toKey(new Date())]}
                    members={members}
                    onEditSchedule={openEditSchedule}
                    onEditCompanyEvent={openEditCompanyEvent}
                  />
                  <button
                    onClick={() => setMobileShowFullMonth(true)}
                    className="w-full text-xs font-semibold py-2.5 rounded text-white"
                    style={{ backgroundColor: ACCENT }}
                  >
                    전월 일정 보기
                  </button>
                </>
              )}
            </div>
          </div>
          <div className="lg:col-span-1 space-y-4">
            <MemberManager members={members} onAdd={addMember} onUpdate={updateMember} onDelete={deleteMember} />
            <HolidayManager holidays={holidays} onAdd={addHoliday} onDelete={deleteHoliday} />
            <RecurringEventManager recurringEvents={recurringEvents} onAdd={addRecurringEvent} onUpdate={updateRecurringEvent} onDelete={deleteRecurringEvent} />
          </div>
        </div>
      </div>

      <ScheduleModal
        open={modalOpen}
        onClose={closeModal}
        members={members}
        initial={editingItem}
        initialKind={editingKind}
        defaultDate={modalDefaultDate}
        defaultMemberId={modalDefaultMemberId}
        onSaveSchedule={saveSchedule}
        onDeleteSchedule={deleteSchedule}
        onSaveCompanyEvent={saveCompanyEvent}
        onDeleteCompanyEvent={deleteCompanyEvent}
        onQuickAddMember={addMember}
        onAddRecurring={addRecurringEvent}
      />

      <DayDetailModal
        dateKey={dayDetailKey}
        schedules={scheduleMap[dayDetailKey] || []}
        companyEvents={displayCompanyEventMap[dayDetailKey] || []}
        members={members}
        onClose={() => setDayDetailKey(null)}
        onEdit={openEditSchedule}
        onEditCompanyEvent={openEditCompanyEvent}
        onAddNew={(key) => {
          setDayDetailKey(null);
          openAddModal(key);
        }}
      />

      <ChangePasswordModal open={changePasswordOpen} onClose={() => setChangePasswordOpen(false)} />

      <ExcelImportModal preview={excelPreview} busy={excelBusy} onCancel={() => setExcelPreview(null)} onConfirm={applyExcelImport} />

      <RecurringInfoModal
        target={recurringInfoTarget}
        onClose={() => setRecurringInfoTarget(null)}
        onDeleteTemplate={(id) => {
          deleteRecurringEvent(id);
          setRecurringInfoTarget(null);
        }}
        onSetOverride={setRecurringOverride}
      />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
