// ---------------- utils ----------------
function pad(n) {
  return String(n).padStart(2, "0");
}
function toKey(date) {
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}
function parseKey(key) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
function startOfWeek(date) {
  const d = new Date(date);
  d.setDate(d.getDate() - d.getDay());
  return d;
}
function isToday(date) {
  return toKey(date) === toKey(new Date());
}
function genId(prefix) {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
}
function hashColorIndex(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
  }
  return hash % MEMBER_COLORS.length;
}
function getMonthGrid(currentDate) {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startWeekday = firstDay.getDay();
  const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
  const startDate = addDays(firstDay, -startWeekday);
  return Array.from({ length: totalCells }, (_, i) => addDays(startDate, i));
}
function getWeekGrid(currentDate) {
  const start = startOfWeek(currentDate);
  return Array.from({ length: 7 }, (_, i) => addDays(start, i));
}
function isNonWorkingDay(dateKey, holidayMap) {
  const d = parseKey(dateKey);
  const dow = d.getDay();
  return dow === 0 || dow === 6 || !!holidayMap[dateKey];
}
function resolveRecurringDate(year, month, dayOfMonth, shiftDirection, holidayMap) {
  const daysInMonth = new Date(year, month, 0).getDate();
  const day = Math.min(dayOfMonth, daysInMonth);
  let d = new Date(year, month - 1, day);
  const step = shiftDirection === "after" ? 1 : -1;
  let guard = 0;
  while (isNonWorkingDay(toKey(d), holidayMap) && guard < 14) {
    d = addDays(d, step);
    guard++;
  }
  return toKey(d);
}

// ------------- excel import (계획 sheet -> schedules) -------------
const EXCEL_TARGET_DEPT = "경영지원실";

function parseExcelWorkbook(workbook, existingMembers) {
  const results = [];
  workbook.SheetNames.forEach((sheetName) => {
    if (!sheetName.includes("계획")) return;
    const m = sheetName.match(/(\d{4})\s*년\s*(\d{1,2})\s*월/);
    if (!m) return;
    const year = Number(m[1]);
    const month = Number(m[2]);

    const ws = workbook.Sheets[sheetName];
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
    const dayRow = aoa[4] || []; // row 5: day-of-month numbers
    const dayCols = [];
    dayRow.forEach((v, idx) => {
      if (typeof v === "number" && v >= 1 && v <= 31) dayCols.push({ col: idx, day: v });
    });
    if (dayCols.length === 0) return;

    let currentDept = null;
    const peopleMap = new Map(); // name -> { title, marks: [{day, mark}] }
    for (let r = 5; r < aoa.length; r++) {
      const row = aoa[r] || [];
      const deptCell = row[0];
      if (deptCell !== null && deptCell !== undefined && String(deptCell).trim() !== "") {
        currentDept = String(deptCell).trim();
      }
      const name = row[2];
      if (!name || !currentDept || !currentDept.includes(EXCEL_TARGET_DEPT)) continue;
      const nameStr = String(name).trim();
      const title = row[3] ? String(row[3]).trim() : "";
      if (!peopleMap.has(nameStr)) peopleMap.set(nameStr, { title, marks: [] });
      const entry = peopleMap.get(nameStr);
      dayCols.forEach(({ col, day }) => {
        const mark = row[col];
        if (mark !== null && mark !== undefined && String(mark).trim() !== "") {
          entry.marks.push({ day, mark: String(mark).trim() });
        }
      });
    }

    if (peopleMap.size === 0) return;

    const newNames = [];
    const unrecognized = [];
    const people = [];
    peopleMap.forEach((info, name) => {
      if (!existingMembers.some((mm) => mm.name === name) && !newNames.includes(name)) {
        newNames.push(name);
      }
      const classified = [];
      [...info.marks]
        .sort((a, b) => a.day - b.day)
        .forEach(({ day, mark }) => {
          const dateObj = new Date(year, month - 1, day);
          const dow = dateObj.getDay();
          let type = null;
          let isHolidayWork = false;
          if (mark === "●") {
            type = dow === 0 || dow === 6 ? "휴무" : "대체휴무(연차)";
            isHolidayWork = type === "대체휴무(연차)";
          } else if (mark === "★") {
            unrecognized.push({ name, day, mark });
            return;
          } else if (mark === "연차") {
            type = "연차";
          } else if (mark === "반차") {
            type = "반차";
          } else {
            unrecognized.push({ name, day, mark });
            return;
          }
          classified.push({ day, type, isHolidayWork });
        });

      const ranges = [];
      classified.forEach((c) => {
        const last = ranges[ranges.length - 1];
        if (last && last.type === c.type && last.isHolidayWork === c.isHolidayWork && c.day === last.endDay + 1) {
          last.endDay = c.day;
        } else {
          ranges.push({ type: c.type, isHolidayWork: c.isHolidayWork, startDay: c.day, endDay: c.day });
        }
      });

      people.push({
        name,
        title: info.title,
        ranges: ranges.map((r) => ({
          type: r.type,
          isHolidayWork: r.isHolidayWork,
          startDate: toKey(new Date(year, month - 1, r.startDay)),
          endDate: toKey(new Date(year, month - 1, r.endDay)),
        })),
      });
    });

    results.push({
      batchKey: `excel-${year}-${pad(month)}-${EXCEL_TARGET_DEPT}`,
      year,
      month,
      sheetName,
      deptName: EXCEL_TARGET_DEPT,
      people,
      newNames,
      unrecognized,
    });
  });
  return results;
}

// ------------- style helpers -------------
// 연차/반차: 동일한 양식(채워진 필/보더 없음)이되, 색의 짙음(연차)과 옅음(반차)으로만 구분한다.
// 휴무/대체휴무(연차)/대체휴무(반차)/휴일근무: 동일한 양식(좌측 굵은 보더 + 흰 배경)이되, 이름 표기(typeLabel)로만 구분한다.
function chipStyle(type, color) {
  switch (type) {
    case "연차":
      return { backgroundColor: color.bg, color: "#fff", border: "1px solid transparent" };
    case "반차":
      return { backgroundColor: color.light, color: color.bg, border: "1px solid transparent" };
    case "휴무":
    case "대체휴무(반차)":
    case "대체휴무(연차)":
    case "휴일근무":
      return {
        backgroundColor: "#fff",
        color: color.bg,
        borderLeft: `3px solid ${color.bg}`,
        borderTop: "1px solid #E5E7EB",
        borderRight: "1px solid #E5E7EB",
        borderBottom: "1px solid #E5E7EB",
      };
    case "외부일정":
      return { backgroundColor: "#fff", color: color.bg, border: `1.5px dashed ${color.bg}` };
    case "내부일정":
      return { backgroundColor: "#fff", color: color.bg, border: `1.5px dotted ${color.bg}` };
    case "경조휴무":
      return { backgroundColor: "#fff", color: color.bg, border: `3px double ${color.bg}` };
    default:
      return { backgroundColor: color.light, color: color.bg, border: "1px solid transparent" };
  }
}

// 캘린더 배지에 표시할 짧은 이름 접미사. 저장되는 실제 type 값은 그대로 유지하고, 화면 표기만 축약한다.
function typeLabel(type) {
  switch (type) {
    case "휴무":
      return "휴";
    case "대체휴무(연차)":
      return "대휴/연";
    case "대체휴무(반차)":
      return "대휴/반";
    case "휴일근무":
      return "휴근";
    case "경조휴무":
      return "경조";
    default:
      return type; // 연차, 반차, 외부일정, 내부일정 등은 그대로 표기
  }
}

function companyEventStyle(kind) {
  if (kind === "external") {
    return { backgroundColor: "#fff", color: ACCENT, border: `1.5px dashed ${ACCENT}` };
  }
  return { backgroundColor: ACCENT, color: "#fff", border: "1px solid transparent" };
}

        e.stopPropagation();

      }}

      style={style}
    >
      {member ? member.name : "(삭제된 팀원)"} ({label})
    </div>
  );
}

  const icon = event.isRecurring ? "🔁" : event.kind === "external" ? "🧳" : "📌";
  return (
    <div

      className="text-xs px-1.5 py-1 rounded mb-1 truncate cursor-pointer font-bold leading-tight hover:opacity-90"
      style={companyEventStyle(event.kind)}
    >
      {icon} {event.title}
    </div>
  );
}

// ------------- multi-day bar layout (month/week views) -------------
// 요구사항 5: 여러 날에 걸친 동일 일정은 하나의 막대로 길게 표시하고,
// 주(week) 경계를 넘어 이어지는 일정은 앞뒤 주에서 동일한 lane(높이)을 유지한다.
const BAR_LANE_HEIGHT = 24; // 막대(칩) 한 줄의 높이(px)
const DAY_HEADER_HEIGHT = 24; // 날짜 숫자/공휴일명이 표시되는 상단 영역 높이(px)
const CALENDAR_BOTTOM_MARGIN_PX = 76; // 화면 하단에서 남겨둘 여백 ≈ 2cm

function useAvailableHeight(ref, marginPx, minHeight) {
  const [height, setHeight] = useState(minHeight);
  useEffect(() => {
    function recalc() {
      if (!ref.current) return;
      const top = ref.current.getBoundingClientRect().top;
      const avail = window.innerHeight - top - marginPx;
      setHeight(Math.max(minHeight, Math.round(avail)));
    }
    recalc();
    window.addEventListener("resize", recalc);
    let ro = null;
    if (typeof ResizeObserver !== "undefined") {
      ro = new ResizeObserver(recalc);
      ro.observe(document.body);
    }
    return () => {
      window.removeEventListener("resize", recalc);
      if (ro) ro.disconnect();
    };
  }, [ref, marginPx, minHeight]);
  return height;
}

function layoutWeeks(weeks, items) {
  let carryLanes = {};
  return weeks.map((weekDays) => {
    // currentDate의 시/분/초 성분이 남아 있을 수 있으므로 자정 기준으로 정규화한다
    const weekStartKey = toKey(weekDays[0]);
    const weekEndKey = toKey(weekDays[6]);
    const weekStart = parseKey(weekStartKey);
    const weekEnd = parseKey(weekEndKey);
    const relevant = items.filter((it) => it.endDate >= weekStartKey && it.startDate <= weekEndKey);
    const clipped = relevant.map((it) => {
      const s = it.startDate < weekStartKey ? weekStart : parseKey(it.startDate);
      const e = it.endDate > weekEndKey ? weekEnd : parseKey(it.endDate);
      const startCol = Math.round((s - weekStart) / 86400000);
      const endCol = Math.round((e - weekStart) / 86400000);
      return { ...it, startCol, endCol };
    });

    // 지난 주부터 이어지는 일정은 기존 lane을 그대로 유지 (가장 낮은/일관된 높이 유지)
    const continuing = [];
    const fresh = [];
    clipped.forEach((it) => {
      if (it.startDate < weekStartKey && carryLanes[it.id] !== undefined) continuing.push(it);
      else fresh.push(it);
    });
    continuing.sort((a, b) => carryLanes[a.id] - carryLanes[b.id]);
    fresh.sort((a, b) => a.startCol - b.startCol || (b.endCol - b.startCol) - (a.endCol - a.startCol) || a.sortKey.localeCompare(b.sortKey));

    const laneEnds = [];
    const placed = [];
    continuing.forEach((it) => {
      let lane = carryLanes[it.id];
      if (laneEnds[lane] !== undefined && laneEnds[lane] >= it.startCol) {
        lane = 0;
        while (laneEnds[lane] !== undefined && laneEnds[lane] >= it.startCol) lane++;
      }
      laneEnds[lane] = it.endCol;
      placed.push({ ...it, lane });
    });
    fresh.forEach((it) => {
      let lane = 0;
      while (laneEnds[lane] !== undefined && laneEnds[lane] >= it.startCol) lane++;
      laneEnds[lane] = it.endCol;
      placed.push({ ...it, lane });
    });

    const nextCarry = {};
    placed.forEach((it) => {
      if (it.endDate > weekEndKey) nextCarry[it.id] = it.lane;
    });
    carryLanes = nextCarry;

    placed.sort((a, b) => a.lane - b.lane || a.startCol - b.startCol);
    return placed;
  });
}

function BarChip({ item, members, laneHeight, onClick }) {
  const left = (item.startCol / 7) * 100;
  const width = ((item.endCol - item.startCol + 1) / 7) * 100;
  const top = item.lane * laneHeight;
  let style, content, tooltip;
  if (item.kind === "schedule") {
    const s = item.raw;
    const member = members.find((m) => m.id === s.memberId);
    const color = MEMBER_COLORS[hashColorIndex(member?.id || "x")];
    style = chipStyle(s.type, color);
    content = `${member ? member.name : "(삭제된 팀원)"}(${typeLabel(s.type)})`;
    tooltip = s.note || "";
  } else {
    const ev = item.raw;
    style = companyEventStyle(ev.kind);
    const icon = ev.isRecurring ? "🔁" : ev.kind === "external" ? "🧳" : "📌";
    content = `${icon} ${ev.title}`;
    tooltip = ev.note || ev.title || "";
  }
  return (
    <div
      onClick={(e) => {
        e.stopPropagation();
        onClick();
      }}
      title={tooltip}
      className="absolute text-xs px-1.5 rounded truncate cursor-pointer font-medium leading-tight hover:opacity-80 flex items-center"
      style={{
        left: `calc(${left}% + 2px)`,
        width: `calc(${width}% - 4px)`,
        top,
        height: laneHeight - 4,
        pointerEvents: "auto",
        ...style,
      }}
    >
      {content}
    </div>
  );
}

function WeekRow({ weekDays, holidayMap, laidOutItems, maxVisibleLanes, laneHeight, headerHeight, rowHeight, members, onAdd, onEditSchedule, onEditCompanyEvent, onShowMore, forceInMonth, currentMonth }) {
  const hiddenByCol = [0, 0, 0, 0, 0, 0, 0];
  const visible = [];
  laidOutItems.forEach((it) => {
    if (it.lane < maxVisibleLanes) {
      visible.push(it);
    } else {
      for (let c = it.startCol; c <= it.endCol; c++) hiddenByCol[c]++;
    }
  });

  return (
    <div className="grid grid-cols-7 relative" style={{ height: rowHeight, gridTemplateRows: "1fr" }}>
      {weekDays.map((d) => {
        const key = toKey(d);
        const inMonth = forceInMonth || d.getMonth() === currentMonth;
        const today = isToday(d);
        const dow = d.getDay();
        const holidayName = holidayMap[key];
        let dateColor = "#374151";
        if (dow === 0) dateColor = "#DC2626";
        if (dow === 6) dateColor = "#2563EB";
        if (holidayName) dateColor = "#DC2626";
        if (!inMonth) dateColor = "#D1D5DB";
        let bgColor = "#fff";
        if (holidayName) bgColor = "#FEF2F2";
        if (today) bgColor = ACCENT_LIGHT;
        return (
          <div
            key={key}
            onClick={() => onAdd(key)}
            className="border cursor-pointer overflow-hidden hover:bg-gray-50 transition-colors"
            style={{ backgroundColor: bgColor, borderColor: today ? ACCENT : "#EEF0F3", opacity: inMonth ? 1 : 0.55 }}
          >
            <div className="flex items-baseline justify-between gap-1 px-1.5 pt-1">
              <span className="text-xs font-semibold" style={{ fontFamily: FONT_MONO, color: dateColor }}>
                {d.getDate()}
              </span>
              {holidayName && (
                <span className="text-[10px] font-semibold truncate" style={{ color: "#DC2626" }}>{holidayName}</span>
              )}
            </div>
          </div>
        );
      })}
      <div className="absolute left-0 right-0" style={{ top: headerHeight, bottom: 0, pointerEvents: "none" }}>
        {visible.map((it) => (
          <BarChip
            key={it.id}
            item={it}
            members={members}
            laneHeight={laneHeight}
            onClick={() => (it.kind === "schedule" ? onEditSchedule(it.raw) : onEditCompanyEvent(it.raw))}
          />
        ))}
        {weekDays.map((d, colIdx) => {
          const count = hiddenByCol[colIdx];
          if (!count) return null;
          const key = toKey(d);
          return (
            <div
              key={`more_${key}`}
              onClick={(e) => {
                e.stopPropagation();
                onShowMore(key);
              }}
              className="absolute text-[11px] font-semibold px-1.5 cursor-pointer hover:underline truncate"
              style={{
                left: `${(colIdx / 7) * 100}%`,
                width: `${(1 / 7) * 100}%`,
                top: maxVisibleLanes * laneHeight,
                height: laneHeight,
                lineHeight: `${laneHeight}px`,
                color: ACCENT,
                pointerEvents: "auto",
              }}
            >
              +{count}개 더보기
            </div>
          );
        })}
      </div>
    </div>
  );
}

function MonthView({ currentDate, barItems, holidayMap, members, onAdd, onEditSchedule, onEditCompanyEvent, onShowMore }) {
  const days = useMemo(() => getMonthGrid(currentDate), [currentDate]);
  const weeks = useMemo(() => {
    const chunks = [];
    for (let i = 0; i < days.length; i += 7) chunks.push(days.slice(i, i + 7));
    return chunks;
  }, [days]);

  const containerRef = useRef(null);
  const availableHeight = useAvailableHeight(containerRef, CALENDAR_BOTTOM_MARGIN_PX, weeks.length * 96);
  const WEEKDAY_HEADER_H = 34;
  const gridHeight = Math.max(weeks.length * 96, availableHeight - WEEKDAY_HEADER_H);
  const rowHeight = Math.floor(gridHeight / weeks.length);

  const weekLayouts = useMemo(() => layoutWeeks(weeks, barItems), [weeks, barItems]);

  return (
    <div ref={containerRef} className="border rounded-lg overflow-hidden" style={{ borderColor: "#EEF0F3" }}>
      <div className="overflow-x-auto">
        <div style={{ minWidth: 630 }}>
          <div className="grid grid-cols-7" style={{ backgroundColor: "#F8F9FB" }}>
            {WEEKDAYS.map((w, i) => (
              <div key={w} className="text-center text-xs font-semibold py-2" style={{ color: i === 0 ? "#DC2626" : i === 6 ? "#2563EB" : "#6B7280" }}>
                {w}
              </div>
            ))}
          </div>
          {weeks.map((weekDays, idx) => {
            const laidOutItems = weekLayouts[idx];
            const totalLanesNeeded = laidOutItems.reduce((m, it) => Math.max(m, it.lane + 1), 0);
            const available = Math.max(BAR_LANE_HEIGHT, rowHeight - DAY_HEADER_HEIGHT - 4);
            const fitLanes = Math.max(1, Math.floor(available / BAR_LANE_HEIGHT));
            const maxVisibleLanes = totalLanesNeeded > fitLanes ? Math.max(1, fitLanes - 1) : fitLanes;
            return (
              <WeekRow
                key={idx}
                weekDays={weekDays}
                holidayMap={holidayMap}
                laidOutItems={laidOutItems}
                maxVisibleLanes={maxVisibleLanes}
                laneHeight={BAR_LANE_HEIGHT}
                headerHeight={DAY_HEADER_HEIGHT}
                rowHeight={rowHeight}
                members={members}
                onAdd={onAdd}
                onEditSchedule={onEditSchedule}
                onEditCompanyEvent={onEditCompanyEvent}
                onShowMore={onShowMore}
                currentMonth={currentDate.getMonth()}
              />

      </div>
      <p className="text-[11px] text-center py-1.5 sm:hidden" style={{ color: "#9CA3AF", borderTop: "1px solid #EEF0F3" }}>← 옆으로 밀어서 요일을 더 볼 수 있어요 →</p>
    </div>
  );
}

  { value: 3, label: "3·6·9·12월" },
];
const ALL_MONTHS = Array.from({ length: 12 }, (_, i) => i + 1);

function describeRecurringFrequency(r) {
  const freq = r.frequency || "monthly";
  const dayLabel = formatDayOfMonth(r.dayOfMonth);
  if (freq === "yearly" && r.months && r.months.length) {
    return `매년 ${r.months[0]}월 ${dayLabel}`;
  }
  if (freq === "quarterly" && r.months && r.months.length) {
    return `분기별(${r.months.join("·")}월) ${dayLabel}`;
  }
  if (freq === "custom" && r.months && r.months.length) {
    return `특정월(${r.months.join(",")}월) ${dayLabel}`;
  }
  return `매월 ${dayLabel}`;
}

function RecurringEventManager({ recurringEvents, onAdd, onUpdate, onDelete }) {
  const [open, setOpen] = useState(true);
  const [title, setTitle] = useState("");
  const [frequency, setFrequency] = useState("monthly"); // "monthly" | "quarterly" | "yearly" | "custom"
  const [dayOfMonth, setDayOfMonth] = useState(15);
  const [quarterGroup, setQuarterGroup] = useState(1);
  const [yearlyMonth, setYearlyMonth] = useState(1);
  const [customMonths, setCustomMonths] = useState([]);
  const [shiftDirection, setShiftDirection] = useState("before");
  const [kind, setKind] = useState("internal");
  const [note, setNote] = useState("");
  const [editingId, setEditingId] = useState(null);

  const toggleCustomMonth = (m) => {
    setCustomMonths((prev) => (prev.includes(m) ? prev.filter((x) => x !== m) : [...prev, m].sort((a, b) => a - b)));
  };

  const resetForm = () => {
    setTitle("");
    setFrequency("monthly");
    setDayOfMonth(15);
    setQuarterGroup(1);
    setYearlyMonth(1);
    setCustomMonths([]);
    setShiftDirection("before");
    setKind("internal");
    setNote("");
    setEditingId(null);
  };

  const submit = () => {
    if (!title.trim()) return;
    if (frequency === "custom" && customMonths.length === 0) {
      window.alert("특정월 선택 시 최소 한 개 이상의 달을 선택해주세요.");
      return;
    }
    let months = null;
    if (frequency === "quarterly") months = [quarterGroup, quarterGroup + 3, quarterGroup + 6, quarterGroup + 9];
    else if (frequency === "yearly") months = [yearlyMonth];
    else if (frequency === "custom") months = [...customMonths];
    const data = {
      title: title.trim(),
      frequency,
      months,
      dayOfMonth: dayOfMonth === LAST_DAY_OF_MONTH ? LAST_DAY_OF_MONTH : Math.min(31, Math.max(1, Number(dayOfMonth) || 1)),
      shiftDirection,
      kind,
      note: note.trim(),
    };
    if (editingId) {
      onUpdate(editingId, data);
    } else {
      onAdd(data);
    }
    resetForm();
  };

  const startEdit = (r) => {
    const freq = r.frequency || "monthly";
    setEditingId(r.id);
    setTitle(r.title);
    setFrequency(freq);
    setDayOfMonth(r.dayOfMonth);
    setQuarterGroup(freq === "quarterly" && r.months && r.months.length ? Math.min(...r.months) : 1);
    setYearlyMonth(freq === "yearly" && r.months && r.months.length ? r.months[0] : 1);
    setCustomMonths(freq === "custom" && r.months ? r.months : []);
    setShiftDirection(r.shiftDirection);
    setKind(r.kind || "internal");
    setNote(r.note || "");
  };

  return (
    <div className="bg-white border rounded-lg p-4" style={{ borderColor: "#EEF0F3" }}>
      <div className="flex items-center justify-between mb-3">
        <h3 className="text-sm font-bold" style={{ color: "#111827" }}>반복 일정 관리</h3>
        <button onClick={() => setOpen(!open)} className="text-xs font-semibold px-1.5 py-0.5" style={{ color: ACCENT }}>{open ? "숨기기" : "펼치기"}</button>
      </div>
      {open && (
        <>
          <p className="text-xs mb-2" style={{ color: "#9CA3AF" }}>
            매월·분기별·매년·특정월 중 원하는 주기로 정해진 날짜에 자동 생성돼요. 그 날짜가 휴무(주말·공휴일)면 이전/이후 평일로 옮겨져요. 등록한 날짜부터 적용되며, 그 이전에는 생성되지 않아요.
          </p>
          <div className="space-y-1.5 mb-3">
            {recurringEvents.length === 0 && <p className="text-xs" style={{ color: "#9CA3AF" }}>등록된 반복 일정이 없습니다.</p>}
            {recurringEvents.map((r) => (
              <div key={r.id} className="flex items-center justify-between text-xs py-1">
                <span>
                  <span className="font-semibold">{r.title}</span>
                  <span
                    className="ml-1 px-1 rounded"
                    style={{
                      fontSize: 10,
                      fontWeight: 600,
                      color: (r.kind || "internal") === "external" ? ACCENT : "#fff",
                      backgroundColor: (r.kind || "internal") === "external" ? "#fff" : ACCENT,
                      border: (r.kind || "internal") === "external" ? `1px dashed ${ACCENT}` : "1px solid transparent",
                    }}
                  >
                    {(r.kind || "internal") === "external" ? "외부" : "내부"}
                  </span>
                  <span style={{ color: "#9CA3AF" }}>
                    {" "}
                    ({describeRecurringFrequency(r)}, 휴무 시 {r.shiftDirection === "after" ? "이후" : "이전"} 평일{r.createdAt ? `, ${r.createdAt}부터 적용` : ""})
                  </span>
                </span>
                <span className="flex items-center gap-2">
                  <button onClick={() => startEdit(r)} className="p-1.5 -m-1.5"><Pencil size={12} color="#9CA3AF" /></button>
                  <button onClick={() => onDelete(r.id)} className="p-1.5 -m-1.5"><Trash2 size={12} color="#9CA3AF" /></button>
                </span>
              </div>
            ))}
          </div>
          <div className="space-y-1.5 pt-2 border-t" style={{ borderColor: "#F3F4F6" }}>
            <input placeholder="일정명 (예: 급여일)" value={title} onChange={(e) => setTitle(e.target.value)} className="w-full text-xs border rounded px-2 py-1.5" style={{ borderColor: "#E5E7EB" }} />
            <div className="grid grid-cols-2 gap-1.5">
              <button
                onClick={() => setKind("internal")}
                className="text-xs font-medium py-1.5 rounded border"
                style={kind === "internal" ? { backgroundColor: ACCENT, borderColor: ACCENT, color: "#fff" } : { backgroundColor: "#fff", borderColor: "#E5E7EB", color: "#374151" }}
              >
                내부일정
              </button>
              <button
                onClick={() => setKind("external")}
                className="text-xs font-medium py-1.5 rounded border"
                style={kind === "external" ? { backgroundColor: ACCENT, borderColor: ACCENT, color: "#fff" } : { backgroundColor: "#fff", borderColor: "#E5E7EB", color: "#374151" }}
              >
                외부일정
              </button>
            </div>
            <div className="flex items-center gap-1.5">
              <span className="text-xs whitespace-nowrap" style={{ color: "#6B7280" }}>반복 주기</span>
              <select value={frequency} onChange={(e) => setFrequency(e.target.value)} className="flex-1 text-xs border rounded px-1.5 py-1.5 min-w-0" style={{ borderColor: "#E5E7EB" }}>
                <option value="monthly">매월</option>
                <option value="quarterly">분기별 (4개월마다)</option>
                <option value="yearly">매년 (연 1회)</option>
                <option value="custom">특정월 선택</option>
              </select>
            </div>
            {frequency === "quarterly" && (
              <div className="flex items-center gap-1.5">
                <span className="text-xs whitespace-nowrap" style={{ color: "#6B7280" }}>대상월</span>
                <select value={quarterGroup} onChange={(e) => setQuarterGroup(Number(e.target.value))} className="flex-1 text-xs border rounded px-1.5 py-1.5 min-w-0" style={{ borderColor: "#E5E7EB" }}>
                  {QUARTER_GROUPS.map((g) => (
                    <option key={g.value} value={g.value}>{g.label}</option>
                  ))}
                </select>
              </div>
            )}
            {frequency === "yearly" && (
              <div className="flex items-center gap-1.5">
                <span className="text-xs whitespace-nowrap" style={{ color: "#6B7280" }}>대상월</span>
                <select value={yearlyMonth} onChange={(e) => setYearlyMonth(Number(e.target.value))} className="flex-1 text-xs border rounded px-1.5 py-1.5 min-w-0" style={{ borderColor: "#E5E7EB" }}>
                  {ALL_MONTHS.map((m) => (
                    <option key={m} value={m}>{m}월</option>
                  ))}
                </select>
              </div>
            )}
            {frequency === "custom" && (
              <div>
                <p className="text-xs mb-1" style={{ color: "#6B7280" }}>대상월 (복수 선택 가능)</p>
                <div className="grid grid-cols-6 gap-1">
                  {ALL_MONTHS.map((m) => (
                    <label key={m} className="flex items-center justify-center gap-0.5 text-[10px] border rounded py-1" style={customMonths.includes(m) ? { backgroundColor: ACCENT, borderColor: ACCENT, color: "#fff" } : { borderColor: "#E5E7EB", color: "#374151" }}>
                      <input type="checkbox" className="hidden" checked={customMonths.includes(m)} onChange={() => toggleCustomMonth(m)} />
                      {m}월
                    </label>
                  ))}
                </div>
              </div>
            )}
            <div className="flex items-center gap-1.5">
              <span className="text-xs whitespace-nowrap" style={{ color: "#6B7280" }}>{frequency === "monthly" ? "매월" : "해당 월"}</span>
              <select
                value={dayOfMonth === LAST_DAY_OF_MONTH ? "last" : dayOfMonth}
                onChange={(e) => setDayOfMonth(e.target.value === "last" ? LAST_DAY_OF_MONTH : Number(e.target.value))}
                className="w-20 text-xs border rounded px-1.5 py-1.5"
                style={{ borderColor: "#E5E7EB", fontFamily: FONT_MONO }}
              >
                {Array.from({ length: 31 }, (_, i) => i + 1).map((d) => (
                  <option key={d} value={d}>{d}일</option>
                ))}
                <option value="last">말일</option>
              </select>
              <span className="text-xs whitespace-nowrap" style={{ color: "#6B7280" }}>· 휴무 시</span>
              <select value={shiftDirection} onChange={(e) => setShiftDirection(e.target.value)} className="flex-1 text-xs border rounded px-1.5 py-1.5 min-w-0" style={{ borderColor: "#E5E7EB" }}>
                <option value="before">이전 평일</option>
                <option value="after">이후 평일</option>
              </select>
            </div>
            <input placeholder="메모 (선택)" value={note} onChange={(e) => setNote(e.target.value)} className="w-full text-xs border rounded px-2 py-1.5" style={{ borderColor: "#E5E7EB" }} />
            <div className="flex items-center gap-1.5">
              <button onClick={submit} className="flex-1 text-xs font-semibold px-2 py-1.5 rounded text-white" style={{ backgroundColor: ACCENT }}>
                {editingId ? "수정 저장" : "추가"}
              </button>
              {editingId && (
                <button onClick={resetForm} className="text-xs font-semibold px-2 py-1.5" style={{ color: "#9CA3AF" }}>취소</button>
              )}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function ScheduleModal({ open, onClose, members, initial, initialKind, defaultDate, defaultMemberId, onSaveSchedule, onDeleteSchedule, onSaveCompanyEvent, onDeleteCompanyEvent, onQuickAddMember, onAddRecurring }) {
  const [mode, setMode] = useState("personal"); // "personal" | "company"
  // shared date range (used by both modes)
  const [startDate, setStartDate] = useState("");
  const [endDate, setEndDate] = useState("");
  // personal schedule fields
  const [memberId, setMemberId] = useState("");
  const [type, setType] = useState("연차");
  const [note, setNote] = useState("");
  const [quickName, setQuickName] = useState("");
  const [quickTotal, setQuickTotal] = useState(15);
  const [showQuickAdd, setShowQuickAdd] = useState(false);
  // company event fields
  const [title, setTitle] = useState("");
  const [companyNote, setCompanyNote] = useState("");
  const [companyKind, setCompanyKind] = useState("internal"); // "internal" | "external"
  // 외부(external) company event attendees — informational, visible only when opening the entry
  const [attendeeIds, setAttendeeIds] = useState([]);
  // register as a recurring (매월) rule instead of a single dated event — 내부일정, new entries only
  const [isRecurringMode, setIsRecurringMode] = useState(false);
  const [recurDayOfMonth, setRecurDayOfMonth] = useState(15);
  const [recurShiftDirection, setRecurShiftDirection] = useState("before");
  // copy-as-new-entry mode
  const [isCopy, setIsCopy] = useState(false);

  useEffect(() => {
    if (!open) return;
    setIsCopy(false);
    setIsRecurringMode(false);
    setRecurDayOfMonth(15);
    setRecurShiftDirection("before");
    if (initial && initialKind === "company") {
      setMode("company");
      setTitle(initial.title);
      setStartDate(initial.startDate);
      setEndDate(initial.endDate);
      setCompanyNote(initial.note || "");
      setCompanyKind(initial.kind || "internal");
      setAttendeeIds(initial.attendeeIds || []);
    } else if (initial && initialKind === "schedule") {
      setMode("personal");
      setMemberId(initial.memberId);
      setStartDate(initial.startDate || initial.date);
      setEndDate(initial.endDate || initial.startDate || initial.date);
      setType(initial.type);
      setNote(initial.note || "");
    } else {
      setMode("personal");
      setMemberId(defaultMemberId || members[0]?.id || "");
      const d = defaultDate || toKey(new Date());
      setStartDate(d);
      setEndDate(d);
      setType("연차");
      setNote("");
      setTitle("");
      setCompanyNote("");
      setCompanyKind("internal");
      setAttendeeIds([]);
      if (d) setRecurDayOfMonth(parseKey(d).getDate());
    }
    setShowQuickAdd(false);
  }, [open, initial, initialKind, defaultDate, defaultMemberId]);

  if (!open) return null;
  const isEditing = !!initial;

  const submitPersonal = () => {
    if (!memberId || !startDate) return;
    const end = endDate && endDate >= startDate ? endDate : startDate;
    onSaveSchedule({
      id: initial?.id && !isCopy ? initial.id : genId("sch"),
      memberId,
      startDate,
      endDate: end,
      type,
      note: note.trim(),
    });
  };
  const submitCompany = () => {
    if (isRecurringMode) {
      if (!title.trim()) return;
      onAddRecurring({
        title: title.trim(),
        frequency: "monthly",
        months: null,
        dayOfMonth: recurDayOfMonth === LAST_DAY_OF_MONTH ? LAST_DAY_OF_MONTH : Math.min(31, Math.max(1, Number(recurDayOfMonth) || 1)),
        shiftDirection: recurShiftDirection,
        kind: companyKind,
        note: companyNote.trim(),
      });
      onClose();
      return;
    }
    if (!title.trim() || !startDate) return;
    const end = endDate && endDate >= startDate ? endDate : startDate;
    onSaveCompanyEvent({
      id: initial?.id && !isCopy ? initial.id : genId("evt"),
      title: title.trim(),
      startDate,
      endDate: end,
      note: companyNote.trim(),
      kind: companyKind,
      attendeeIds: companyKind === "external" ? attendeeIds : [],
    });
  };
  const quickAdd = () => {
    if (!quickName.trim()) return;
    const newMember = onQuickAddMember({ name: quickName.trim(), annualTotal: Number(quickTotal) || 0 });
    setMemberId(newMember.id);
    setQuickName("");
    setShowQuickAdd(false);
  };
  const toggleAttendee = (id) => {
    setAttendeeIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  };

  const needsNote = type === "연차" || type === "반차" || type === "대체휴무(반차)" || type === "대체휴무(연차)" || type === "휴일근무" || type === "경조휴무";

  const modalTitle = isCopy ? "새 일정으로 복사" : isEditing ? (mode === "company" ? "회사 일정 수정" : "일정 수정") : "일정 추가";

  return (
    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-xl shadow-xl w-full max-w-md p-6 overflow-y-auto" style={{ maxHeight: "90vh" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-base font-bold" style={{ color: "#111827" }}>{modalTitle}</h3>
          <button onClick={onClose} className="p-1 -m-1"><X size={18} color="#9CA3AF" /></button>
        </div>

        {!isEditing && (
          <div className="grid grid-cols-2 gap-1.5 mb-4">
            <button
              onClick={() => setMode("personal")}
              className="text-xs font-semibold py-1.5 rounded border"
              style={mode === "personal" ? { backgroundColor: ACCENT, borderColor: ACCENT, color: "#fff" } : { backgroundColor: "#fff", borderColor: "#E5E7EB", color: "#374151" }}
            >
              개인 일정
            </button>
            <button
              onClick={() => setMode("company")}
              className="text-xs font-semibold py-1.5 rounded border"
              style={mode === "company" ? { backgroundColor: ACCENT, borderColor: ACCENT, color: "#fff" } : { backgroundColor: "#fff", borderColor: "#E5E7EB", color: "#374151" }}
            >
              회사 일정
            </button>
          </div>
        )}

        {mode === "personal" ? (
          <div className="space-y-3">
            <div>
              <label className="text-xs font-semibold block mb-1" style={{ color: "#374151" }}>팀원</label>
              {members.length === 0 || showQuickAdd ? (
                <div className="flex items-center gap-1.5">
                  <input placeholder="이름" value={quickName} onChange={(e) => setQuickName(e.target.value)} className="flex-1 text-sm border rounded px-2 py-1.5" style={{ borderColor: "#E5E7EB" }} />
                  <input type="number" placeholder="연차" value={quickTotal} onChange={(e) => setQuickTotal(e.target.value)} className="w-16 text-sm border rounded px-2 py-1.5" style={{ borderColor: "#E5E7EB" }} />
                  <button onClick={quickAdd} className="text-xs font-semibold px-2 py-1.5 rounded text-white whitespace-nowrap" style={{ backgroundColor: ACCENT }}>추가</button>
                </div>
              ) : (
                <div className="flex items-center gap-2">
                  <select value={memberId} onChange={(e) => setMemberId(e.target.value)} className="flex-1 text-sm border rounded px-2 py-1.5" style={{ borderColor: "#E5E7EB" }}>
                    {members.map((m) => (
                      <option key={m.id} value={m.id}>{m.name}</option>
                    ))}
                  </select>
                  <button onClick={() => setShowQuickAdd(true)} className="text-xs font-semibold whitespace-nowrap" style={{ color: ACCENT }}>+ 새 팀원</button>
                </div>
              )}
            </div>

            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="text-xs font-semibold block mb-1" style={{ color: "#374151" }}>시작일</label>
                <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="w-full text-sm border rounded px-2 py-1.5" style={{ borderColor: "#E5E7EB", fontFamily: FONT_MONO }} />

                {LEAVE_TYPES.map((t) => (
                  <button

                    className="text-xs font-medium py-1.5 rounded border"

                  >

              </div>

            <div>

              <textarea

                style={{ borderColor: "#E5E7EB" }}
              />
            </div>
          </div>
        ) : (
          <div className="space-y-3">

              <label className="text-xs font-semibold block mb-1" style={{ color: "#374151" }}>일정명</label>
              <input

                  className="text-xs font-medium py-1.5 rounded border"

                >
                  내부일정
                </button>
                <button
                  onClick={() => setCompanyKind("external")}
                  className="text-xs font-medium py-1.5 rounded border"
                  style={companyKind === "external" ? { backgroundColor: ACCENT, borderColor: ACCENT, color: "#fff" } : { backgroundColor: "#fff", borderColor: "#E5E7EB", color: "#374151" }}
                >
                  외부일정
                </button>
              </div>
            </div>

            {!isEditing && companyKind === "internal" && (
              <label className="flex items-center gap-2 text-xs p-2 rounded" style={{ color: "#374151", backgroundColor: "#F8F9FB" }}>
                <input type="checkbox" checked={isRecurringMode} onChange={(e) => setIsRecurringMode(e.target.checked)} />

            {!isEditing && companyKind === "internal" && isRecurringMode && (

            )}

            {isRecurringMode ? (

function LoginScreen() {
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if (!password) return;
    setError("");
    setBusy(true);
    try {
      await auth.signInWithEmailAndPassword(APP_LOGIN_EMAIL, password);
    } catch (err) {
      setError("비밀번호가 올바르지 않습니다.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-4" style={{ backgroundColor: "#F5F6F8", fontFamily: FONT_SANS }}>
      <form onSubmit={submit} className="bg-white border rounded-xl p-8 w-full max-w-sm shadow-sm" style={{ borderColor: "#EEF0F3" }}>
        <h1 className="text-lg font-bold mb-1" style={{ color: "#111827" }}>팀 스케줄 캘린더</h1>
        <p className="text-xs mb-5" style={{ color: "#6B7280" }}>비밀번호를 입력해 주세요.</p>
        <input
          type="password"
          autoFocus
          value={password}
          onChange={(e) => setPassword(e.target.value)}
          placeholder="비밀번호"
          className="w-full text-sm border rounded px-3 py-2 mb-3"
          style={{ borderColor: "#E5E7EB" }}
        />
        {error && (
          <p className="text-xs mb-3" style={{ color: "#DC2626" }}>{error}</p>
        )}
        <button
          type="submit"
          disabled={busy || !password}
          className="w-full text-sm font-semibold py-2 rounded text-white disabled:opacity-40"
          style={{ backgroundColor: ACCENT }}
        >
          {busy ? "확인 중..." : "로그인"}
        </button>
      </form>
    </div>
  );
}

function ChangePasswordModal({ open, onClose }) {
  const [current, setCurrent] = useState("");
  const [next, setNext] = useState("");
  const [confirm, setConfirm] = useState("");
  const [error, setError] = useState("");
  const [success, setSuccess] = useState(false);
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (open) {
      setCurrent("");
      setNext("");
      setConfirm("");
      setError("");
      setSuccess(false);
    }
  }, [open]);

  if (!open) return null;

  const submit = async () => {
    setError("");
    if (next.length < 6) {
      setError("새 비밀번호는 6자 이상이어야 합니다.");
      return;
    }
    if (next !== confirm) {
      setError("새 비밀번호가 서로 일치하지 않습니다.");
      return;
    }
    setBusy(true);
    try {
      const user = auth.currentUser;
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, current);
      await user.reauthenticateWithCredential(cred);
      await user.updatePassword(next);
      setSuccess(true);
    } catch (err) {
      setError("현재 비밀번호가 올바르지 않거나 변경에 실패했습니다.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-xl shadow-xl w-full max-w-sm p-6" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-base font-bold" style={{ color: "#111827" }}>비밀번호 변경</h3>
          <button onClick={onClose} className="p-1 -m-1"><X size={18} color="#9CA3AF" /></button>
        </div>
        {success ? (
          <div>
            <p className="text-sm mb-4" style={{ color: "#059669" }}>비밀번호가 변경되었습니다.</p>
            <button onClick={onClose} className="w-full text-xs font-semibold py-2 rounded text-white" style={{ backgroundColor: ACCENT }}>확인</button>
          </div>
        ) : (
          <div className="space-y-3">
            <input type="password" placeholder="현재 비밀번호" value={current} onChange={(e) => setCurrent(e.target.value)} className="w-full text-sm border rounded px-3 py-2" style={{ borderColor: "#E5E7EB" }} />
            <input type="password" placeholder="새 비밀번호 (6자 이상)" value={next} onChange={(e) => setNext(e.target.value)} className="w-full text-sm border rounded px-3 py-2" style={{ borderColor: "#E5E7EB" }} />
            <input type="password" placeholder="새 비밀번호 확인" value={confirm} onChange={(e) => setConfirm(e.target.value)} className="w-full text-sm border rounded px-3 py-2" style={{ borderColor: "#E5E7EB" }} />
            {error && <p className="text-xs" style={{ color: "#DC2626" }}>{error}</p>}
            <button
              onClick={submit}
              disabled={busy || !current || !next || !confirm}
              className="w-full text-xs font-semibold py-2 rounded text-white disabled:opacity-40"
              style={{ backgroundColor: ACCENT }}
            >
              {busy ? "변경 중..." : "비밀번호 변경"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function ExcelImportModal({ preview, busy, onCancel, onConfirm }) {

  const allNewNames = [...new Set(preview.flatMap((s) => s.newNames))];
  const allUnrecognized = preview.flatMap((s) => s.unrecognized);
  return (
    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onClick={onCancel}>
      <div className="bg-white rounded-xl shadow-xl w-full max-w-lg p-6 overflow-y-auto" style={{ maxHeight: "85vh" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-base font-bold" style={{ color: "#111827" }}>엑셀 일정 반영 확인</h3>
          <button onClick={onCancel} className="p-1 -m-1"><X size={18} color="#9CA3AF" /></button>
        </div>

        <div className="space-y-3 text-xs" style={{ color: "#374151" }}>
          {preview.map((sheet) => (
            <div key={sheet.batchKey} className="border rounded p-3" style={{ borderColor: "#EEF0F3" }}>
              <p className="font-bold mb-2">
                {sheet.year}년 {sheet.month}월 · {sheet.deptName} <span style={{ color: "#9CA3AF", fontWeight: 400 }}>({sheet.sheetName})</span>
              </p>
              {sheet.people.map((p) => (
                <p key={p.name} className="mb-1">
                  <span className="font-semibold">{p.name}</span>
                  {p.title ? ` (${p.title})` : ""} — {p.ranges.length}건
                </p>
              ))}
            </div>
          ))}

          {allNewNames.length > 0 && (
            <div className="rounded p-3" style={{ backgroundColor: "#F0FDFA", color: "#0F766E" }}>
              새로 추가될 팀원: <span className="font-semibold">{allNewNames.join(", ")}</span> (연차 15일 기본값으로 등록되며, 팀원 관리에서 나중에 수정할 수 있어요)
            </div>
          )}

          {allUnrecognized.length > 0 && (
            <div className="rounded p-3" style={{ backgroundColor: "#FEF3C7", color: "#92400E" }}>
              인식하지 못한 표시 {allUnrecognized.length}건이 있어 반영에서 제외돼요. 예: {allUnrecognized.slice(0, 4).map((u) => `${u.name} ${u.day}일 "${u.mark}"`).join(", ")}
              {allUnrecognized.length > 4 ? " 등" : ""}
            </div>
          )}

          <p style={{ color: "#6B7280" }}>
            총 {totalEntries}건의 일정이 등록됩니다. 같은 연도·월·부서로 이미 가져온 적이 있다면 그때 가져온 항목은 이번 내용으로 교체돼요. 직접 등록한 개인 일정에는 영향을 주지 않아요.
          </p>
        </div>

        <div className="flex items-center justify-end gap-2 mt-5">
          <button onClick={onCancel} className="text-xs font-semibold px-3 py-2 rounded border" style={{ borderColor: "#E5E7EB", color: "#374151" }}>취소</button>
          <button onClick={onConfirm} disabled={busy} className="text-xs font-semibold px-3 py-2 rounded text-white disabled:opacity-50" style={{ backgroundColor: ACCENT }}>
            {busy ? "반영 중..." : "반영하기"}
          </button>
        </div>
      </div>
    </div>
  );
}

function RecurringInfoModal({ target, onClose, onDeleteTemplate, onSetOverride }) {
  const [mode, setMode] = useState("view"); // "view" | "edit"
  const [date, setDate] = useState("");
  const [title, setTitle] = useState("");
  const [note, setNote] = useState("");

  useEffect(() => {
    if (target) {
      setMode("view");
      setDate(target.date || "");
      setTitle(target.title || "");
      setNote(target.note || "");
    }
  }, [target]);

  if (!target) return null;

  const startEdit = () => {
    setDate(target.date || "");
    setTitle(target.title || "");
    setNote(target.note || "");
    setMode("edit");
  };
  const saveOverride = () => {
    if (!date) return;
    onSetOverride(target.recurringId, target.yearMonth, { date, title: title.trim(), note: note.trim(), skip: false });
    onClose();
  };
  const skipThisMonth = () => {
    if (!window.confirm(`${target.yearMonth} 달만 건너뛸까요? 다른 달은 그대로 유지돼요.`)) return;
    onSetOverride(target.recurringId, target.yearMonth, { skip: true });
    onClose();
  };
  const revertThisMonth = () => {
    onSetOverride(target.recurringId, target.yearMonth, null);
    onClose();
  };

  return (
    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onClick={onClose}>
      <div className="bg-white rounded-xl shadow-xl w-full max-w-sm p-6" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-3">
          <h3 className="text-base font-bold flex items-center gap-2" style={{ color: "#111827" }}>
            🔁 {target.title}
            <span
              className="px-1.5 py-0.5 rounded"
              style={{
                fontSize: 10,
                fontWeight: 700,
                color: (target.kind || "internal") === "external" ? ACCENT : "#fff",
                backgroundColor: (target.kind || "internal") === "external" ? "#fff" : ACCENT,
                border: (target.kind || "internal") === "external" ? `1px dashed ${ACCENT}` : "1px solid transparent",
              }}
            >
              {(target.kind || "internal") === "external" ? "외부" : "내부"}
            </span>
          </h3>
          <button onClick={onClose} className="p-1 -m-1"><X size={18} color="#9CA3AF" /></button>
        </div>

        {mode === "view" ? (
          <>
            <p className="text-xs mb-1" style={{ color: "#6B7280" }}>
              "반복 일정 관리"에서 설정한 주기로 자동 생성돼요.
              {target.isOverridden && <span style={{ color: ACCENT, fontWeight: 600 }}> (이 달은 따로 수정됨)</span>}
            </p>
            {target.note && <p className="text-xs mb-3" style={{ color: "#374151" }}>{target.note}</p>}
            <div className="space-y-2 mt-4">
              <button onClick={startEdit} className="w-full text-xs font-semibold py-2 rounded text-white" style={{ backgroundColor: ACCENT }}>
                이 달만 날짜·내용 수정
              </button>
              <button onClick={skipThisMonth} className="w-full text-xs font-semibold py-2 rounded border" style={{ borderColor: "#E5E7EB", color: "#374151" }}>
                이 달만 건너뛰기
              </button>
              {target.isOverridden && (
                <button onClick={revertThisMonth} className="w-full text-xs font-semibold py-2 rounded border" style={{ borderColor: "#E5E7EB", color: "#374151" }}>
                  이 달 수정 취소 (기본값으로)
                </button>
              )}
              <button onClick={() => onDeleteTemplate(target.recurringId)} className="w-full text-xs font-semibold py-2 rounded" style={{ color: "#DC2626" }}>
                반복 일정 전체 삭제
              </button>
            </div>
          </>
        ) : (
          <div className="space-y-3">
            <p className="text-xs" style={{ color: "#9CA3AF" }}>{target.yearMonth} 달에만 적용돼요. 다른 달은 그대로 유지돼요.</p>
            <div>
              <label className="text-xs font-semibold block mb-1" style={{ color: "#374151" }}>이 달 날짜</label>
              <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full text-sm border rounded px-2 py-1.5" style={{ borderColor: "#E5E7EB", fontFamily: FONT_MONO }} />
            </div>
            <div>
              <label className="text-xs font-semibold block mb-1" style={{ color: "#374151" }}>일정명</label>
              <input value={title} onChange={(e) => setTitle(e.target.value)} className="w-full text-sm border rounded px-2 py-1.5" style={{ borderColor: "#E5E7EB" }} />
            </div>
            <div>
              <label className="text-xs font-semibold block mb-1" style={{ color: "#374151" }}>메모</label>
              <textarea value={note} onChange={(e) => setNote(e.target.value)} rows={2} className="w-full text-sm border rounded px-2 py-1.5 resize-none" style={{ borderColor: "#E5E7EB" }} />
            </div>
            <div className="flex items-center justify-end gap-2 mt-2">
              <button onClick={() => setMode("view")} className="text-xs font-semibold px-3 py-2 rounded border" style={{ borderColor: "#E5E7EB", color: "#374151" }}>취소</button>
              <button onClick={saveOverride} disabled={!date} className="text-xs font-semibold px-3 py-2 rounded text-white disabled:opacity-40" style={{ backgroundColor: ACCENT }}>저장</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}
